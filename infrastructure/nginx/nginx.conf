worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ----------------------------------------------------------
    # Upstream definitions
    # ----------------------------------------------------------
    upstream sers_api {
        server api:3000;
    }

    upstream sers_ml {
        server ml:8001;
    }

    # ----------------------------------------------------------
    # Main server block
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name localhost sers.local;

        # API routes
        location /api/ {
            proxy_pass http://sers_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
        }

        # WebSocket (Socket.io)
        location /socket.io/ {
            proxy_pass http://sers_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ML service routes (internal, but exposed for admin testing)
        location /ml/ {
            proxy_pass http://sers_ml/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://sers_api/api/health;
        }

        # Default
        location / {
            return 200 'SERS API Gateway - OK';
            add_header Content-Type text/plain;
        }
    }
}
